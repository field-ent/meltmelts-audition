
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>melt × melts 新メンバー募集</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:sans-serif;
background:#fff5fa;
color:#444;
overflow-x:hidden;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 20px;
background:rgba(255,255,255,0.95);
backdrop-filter:blur(12px);
z-index:1000;
border-bottom:1px solid #ffd3e5;
}

.logo{
font-size:30px;
font-weight:900;
color:#ff5fa2;
line-height:1;
}

.logo small{
display:block;
font-size:10px;
letter-spacing:0.25em;
margin-top:6px;
color:#8b6b78;
}

.btn{
background:linear-gradient(135deg,#ff7eb3,#ff4d9d);
padding:14px 28px;
border-radius:999px;
color:white;
font-weight:900;
text-decoration:none;
box-shadow:0 10px 30px rgba(255,80,150,0.3);
}

.hero{
padding-top:90px;
text-align:center;
background:linear-gradient(#ffe7f2,#fff);
}

.hero img{
width:100%;
max-width:1400px;
display:block;
margin:auto;
}

.hero-content{
margin-top:-30px;
padding:0 20px 60px;
position:relative;
z-index:2;
}

.hero h1{
font-size:clamp(48px,10vw,100px);
font-weight:900;
color:white;
line-height:1;
text-shadow:
0 0 10px rgba(255,100,170,0.8),
0 5px 0 #ff80b8,
0 12px 25px rgba(255,80,150,0.35);
-webkit-text-stroke:2px #ff9ac5;
}

.copy{
display:inline-block;
margin-top:28px;
padding:14px 30px;
border-radius:999px;
background:white;
color:#ff5fa2;
font-weight:900;
font-size:20px;
box-shadow:0 10px 30px rgba(255,100,170,0.15);
}

.ribbon{
display:inline-block;
margin-top:24px;
background:linear-gradient(135deg,#ff7eb3,#ff4d9d);
padding:12px 40px;
color:white;
font-weight:900;
clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);
}

section{
padding:80px 20px;
}

.container{
max-width:1100px;
margin:auto;
}

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:24px;
}

.card{
background:white;
padding:34px;
border-radius:30px;
border:1px solid #ffd3e5;
box-shadow:0 10px 40px rgba(255,100,170,0.08);
}

.card h2{
font-size:34px;
margin-bottom:20px;
color:#ff5fa2;
}

.card p{
line-height:2;
}

footer{
text-align:center;
padding:40px;
background:#fff0f7;
font-size:12px;
color:#8b6b78;
}

@media(max-width:800px){

.logo{
font-size:22px;
}

.btn{
padding:12px 20px;
font-size:14px;
}

.hero-content{
margin-top:0;
padding-top:20px;
}

.hero h1{
font-size:58px;
}

.copy{
font-size:16px;
width:100%;
max-width:340px;
}

.cards{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<header>
<div class="logo">
melt × melts
<small>NEW MEMBER</small>
</div>

<a class="btn" href="https://x.com/melt_melts_of" target="_blank">
❤ 応募する
</a>
</header>

<section class="hero">

<img src="assets/mainvisual.jpg" alt="melt × melts">

<div class="hero-content">
<h1>新メンバー募集</h1>

<div class="copy">
一緒に、とけあう夢を叶えよう。
</div>

<br>

<div class="ribbon">
melt × melts
</div>

</div>
</section>

<section>
<div class="container">

<div class="cards">

<div class="card">
<h2>ABOUT</h2>

<p>
melt × meltsは、関東を中心に活動する王道アイドルグループです。<br><br>

ライブ活動・SNS・イベント出演などを通して、
ファンの皆さんと一緒に夢を叶えていく仲間を募集しています。
</p>
</div>

<div class="card">
<h2>募集要項</h2>

<p>
・16歳〜27歳<br>
・関東で活動可能な方<br>
・未経験歓迎<br>
・アイドル活動を本気で頑張りたい方
</p>
</div>

</div>

</div>
</section>

<footer>
© melt × melts All Rights Reserved.
</footer>

</body>
</html>
